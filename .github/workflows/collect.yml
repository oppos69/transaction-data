name: 快照数据采集

# 每天盘后（约 15:35 北京）补采快照型 A 股数据；也支持手动触发冒烟。
# 交易日由 collect_snapshots 里的 trade_calendar.guard() 判定，非交易日无变更、不产生空提交。
on:
  schedule:
    # cron 用 UTC。15:35 北京 = 07:35 UTC。避开整点防止跟探针/其他仓库撞车。
    - cron: "35 7 * * *"
  workflow_dispatch:

concurrency:
  group: snapshots
  cancel-in-progress: true

permissions:
  contents: write   # 采集完成后要 commit + push 数据回本仓库

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 项目内多处按**中国时区**做盘前/盘后判定（16:00 规则、交易日/快照新鲜度），runner 默认 UTC 会错位 8 小时。
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 刷新入库的完整交易日历（sina 源，境外可达、无 baostock 阻塞风险）。
      # 保证 trade_calendar.guard() 有「今天 + 未来年度」的排期可用 → 能准确跳过周末/节假日、不产幻影行。
      - name: 刷新交易日历
        run: python _refresh_calendar.py

      - name: 采集快照数据
        run: python collect_snapshots.py

      - name: 提交并推送数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有数据变更，跳过一次提交，不推空仓库。"
          else
            git commit -m "A股快照数据 $(date +%Y-%m-%d)"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin $(git rev-parse --abbrev-ref HEAD)
          fi